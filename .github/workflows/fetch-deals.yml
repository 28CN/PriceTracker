name: Fetch OzBargain deals

# Shop feeds from OzBargain (/deals/<domain>/feed) for the /deals page, and
# fast-food feeds for /eat on a slower clock (crawler/eat.py).
# About 14 small requests per fetch, two seconds apart, conditional GET.
# Started by the site: hourly by the database scheduler (mode "schedule",
# see supabase/migrations/202611260003_scheduled_tick.sql) and when someone
# opens /deals (mode "visit"). crawler/deals.py should_run decides whether to
# fetch: hourly while people look, every ~3 hours otherwise.
# The cron below is only a fallback; GitHub delays or skips it by hours, and
# should_run skips it when the scheduler already fetched.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "manual always fetches; visit unless the last run is under 25 min old; schedule uses the adaptive rule"
        type: choice
        options: [manual, visit, schedule]
        default: manual
      scope:
        description: "all = shop feeds (and food feeds when due); food = only the fast-food feeds (a visit to /eat)"
        type: choice
        options: [all, food]
        default: all

concurrency:
  group: fetch-deals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      # Only what the feed job needs; no browser.
      - run: pip install supabase==2.31.0 requests==2.34.2
      - run: python deals.py --mode "$MODE" --scope "$SCOPE"
        working-directory: crawler
        env:
          MODE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.mode || 'manual' }}
          SCOPE: ${{ inputs.scope || 'all' }}

name: Crawl product prices
# Full crawls are titled "Crawl product prices"; one-item refreshes are not, so the guard can tell them apart.
run-name: ${{ (inputs.product_id || inputs.link_id) && 'Refresh one item' || 'Crawl product prices' }}

on:
  # The full crawl is started Monday and Thursday 03:00 UTC by the database
  # scheduler (supabase/migrations/202611260003_scheduled_tick.sql). These
  # crons are a fallback that GitHub often runs hours late; the guard job
  # skips them when a full crawl already ran in the last 20 hours.
  schedule:
    - cron: "30 6 * * 1"
    - cron: "30 6 * * 4"
  workflow_dispatch:
    inputs:
      product_id:
        description: "Optional product UUID to refresh"
        required: false
        type: string
      link_id:
        description: "Optional tracked_links UUID to refresh"
        required: false
        type: string
      force_refresh:
        description: "Optional flag for manual refresh intent"
        required: false
        default: "true"
        type: string

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list -R "$GITHUB_REPOSITORY" --workflow crawl-prices.yml --limit 30 \
            --json databaseId,createdAt,displayTitle,status,conclusion \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .createdAt > \"$since\" and .displayTitle == \"Crawl product prices\" and (.status != \"completed\" or .conclusion == \"success\"))] | length")
          if [ "$recent" -gt 0 ]; then
            echo "::notice::A full crawl already ran in the last 20 hours; skipping this fallback run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  crawl:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRAWL_PRODUCT_ID: ${{ github.event.inputs.product_id }}
      CRAWL_LINK_ID: ${{ github.event.inputs.link_id }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install crawler dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crawler/requirements.txt') }}

      - name: Install Playwright browsers
        run: |
          set -e
          # `install` is a no-op when the cache already holds the right build, so
          # run it either way. Skipping it on a cache hit used to leave the
          # runner with no browser whenever the cached build was stale.
          python -m playwright install --with-deps chromium
          # The bundled chromium alone is not enough: with no channel Playwright
          # starts chrome-headless-shell, which Akamai refuses outright.
          python -m playwright install chrome || echo "::warning::Google Chrome unavailable; falling back to chromium"
        timeout-minutes: 10

      - name: Verify a branded browser is available
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              for channel in ("chrome", "msedge", "chromium"):
                  try:
                      b = p.chromium.launch(headless=True, channel=channel,
                                            args=["--no-sandbox"])
                  except Exception as error:
                      print(f"{channel}: unavailable ({str(error).splitlines()[0]})")
                      continue
                  print(f"{channel}: OK {b.version}")
                  b.close()
          PY

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Bot-walled shops are skipped automatically when CI=true (see filter_links_by_retailer):
      # kmart, target, bigw, toymate, bunnings, chemistwarehouse.
      # Crawl those from this PC via scripts/crawl-background.ps1 (full weekly run).
      # Optional overrides: vars.CRAWL_SKIP_RETAILERS, secrets.CRAWL_PROXY.
      - name: Warn if Akamai-protected shops rely on local crawl
        run: |
          PROXY="${{ secrets.CRAWL_PROXY }}"
          if [ -z "$PROXY" ]; then
            echo "::notice::CI skips bot-walled shops by default. Local Task Scheduler runs every shop (including Coles/Woolworths/Repco/SCA/Auto Barn) as a full weekly backup."
          fi

      # A browser Playwright starts is refused by several shops even headful, so
      # the crawler starts one itself and drives it over the debugging port. That
      # needs a display, hence xvfb. If it cannot get one it falls back on its own.
      # The crawler claims pending crawl_jobs before it fetches links, so a
      # refresh saved in the database still runs if this dispatch was missed.
      - name: Run crawler
        run: xvfb-run -a python crawler/main.py
        env:
          CRAWL_BROWSER_MODE: cdp
          CRAWL_SKIP_RETAILERS: ${{ vars.CRAWL_SKIP_RETAILERS }}
          CRAWL_PROXY: ${{ secrets.CRAWL_PROXY }}
          CRAWL_PROXY_USERNAME: ${{ secrets.CRAWL_PROXY_USERNAME }}
          CRAWL_PROXY_PASSWORD: ${{ secrets.CRAWL_PROXY_PASSWORD }}

      - name: Upload crawl diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-diagnostics
          path: crawler-diagnostics/
          if-no-files-found: ignore
          retention-days: 7


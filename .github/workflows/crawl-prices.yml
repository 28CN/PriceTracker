name: Crawl product prices

on:
  schedule:
    # Two runs per week (UTC). Adjust as you like.
    - cron: "0 3 * * 1"
    - cron: "0 3 * * 4"
  workflow_dispatch:
    inputs:
      product_id:
        description: "Optional product UUID to refresh"
        required: false
        type: string
      link_id:
        description: "Optional tracked_links UUID to refresh"
        required: false
        type: string
      force_refresh:
        description: "Optional flag for manual refresh intent"
        required: false
        default: "true"
        type: string

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRAWL_PRODUCT_ID: ${{ github.event.inputs.product_id }}
      CRAWL_LINK_ID: ${{ github.event.inputs.link_id }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install crawler dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crawler/requirements.txt') }}

      - name: Install Playwright browsers
        run: |
          set -e
          # `install` is a no-op when the cache already holds the right build, so
          # run it either way. Skipping it on a cache hit used to leave the
          # runner with no browser whenever the cached build was stale.
          python -m playwright install --with-deps chromium
          # The bundled chromium alone is not enough: with no channel Playwright
          # starts chrome-headless-shell, which Akamai refuses outright.
          python -m playwright install chrome || echo "::warning::Google Chrome unavailable; falling back to chromium"
        timeout-minutes: 10

      - name: Verify a branded browser is available
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              for channel in ("chrome", "msedge", "chromium"):
                  try:
                      b = p.chromium.launch(headless=True, channel=channel,
                                            args=["--no-sandbox"])
                  except Exception as error:
                      print(f"{channel}: unavailable ({str(error).splitlines()[0]})")
                      continue
                  print(f"{channel}: OK {b.version}")
                  b.close()
          PY

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # A browser Playwright starts is refused by several shops even headful, so
      # the crawler starts one itself and drives it over the debugging port. That
      # needs a display, hence xvfb. If it cannot get one it falls back on its own.
      - name: Run crawler
        run: xvfb-run -a python crawler/main.py
        env:
          CRAWL_BROWSER_MODE: cdp
          CRAWL_SKIP_RETAILERS: ${{ vars.CRAWL_SKIP_RETAILERS }}
          CRAWL_PROXY: ${{ secrets.CRAWL_PROXY }}
          CRAWL_PROXY_USERNAME: ${{ secrets.CRAWL_PROXY_USERNAME }}
          CRAWL_PROXY_PASSWORD: ${{ secrets.CRAWL_PROXY_PASSWORD }}

      - name: Upload crawl diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-diagnostics
          path: crawler-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

